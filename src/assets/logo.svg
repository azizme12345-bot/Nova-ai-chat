<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Soft Lavender & White Glow Filter -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComponentTransfer in="blur" result="brightBlur">
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Mathematically symmetrical Interlaced Triple-Loop Logo Group -->
  <g transform="translate(0, 0)" filter="url(#purpleGlow)">
    <!-- Loop 1 (Top) -->
    <ellipse cx="50" cy="40" rx="24" ry="14" fill="none" stroke="#ffffff" stroke-width="5" transform="rotate(0 50 50)" />
    <!-- Loop 2 (Bottom-Right) -->
    <ellipse cx="50" cy="40" rx="24" ry="14" fill="none" stroke="#ffffff" stroke-width="5" transform="rotate(120 50 50)" />
    <!-- Loop 3 (Bottom-Left) -->
    <ellipse cx="50" cy="40" rx="24" ry="14" fill="none" stroke="#ffffff" stroke-width="5" transform="rotate(240 50 50)" />

    <!-- Inner overlay curves to create an overlapping interlacing weave effect -->
    <path d="M 50 26 A 24 14 0 0 1 71 36" fill="none" stroke="#f1f2f6" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 71 36 A 24 14 0 0 1 65 58" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 35 58 A 24 14 0 0 1 29 36" fill="none" stroke="#f1f2f6" stroke-width="5.5" stroke-linecap="round" />
  </g>
</svg>
